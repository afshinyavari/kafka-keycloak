# -- Keycloak connection for keycloak-config-cli.
keycloak:
  # -- Base URL of Keycloak (required).
  url: ""
  # -- Realm to log in to. Defaults to realm.name (the admin client lives in our own realm).
  loginRealm: ""
  # -- Existing Secret holding the admin client's credentials (required).
  existingSecret: ""
  secretKeys:
    clientId: clientId
    clientSecret: clientSecret
  sslVerify: true
  # -- ConfigMap with a PEM bundle (key ca-bundle.crt) for an internal CA, e.g.
  # one labelled config.openshift.io/inject-trusted-cabundle=true. An init
  # container builds a Java truststore from it.
  caBundleConfigMap: ""
  caBundleKey: ca-bundle.crt

# -- The realm this release manages.
realm:
  # -- Realm name (required).
  name: ""
  displayName: ""
  # -- Raw realm-level settings merged into the realm representation.
  settings: {}

# -- Keycloak groups. Teams become subgroups of the parent: /<parent>/<team>.
groups:
  parent: kafka

# -- Teams, keyed by name. Maps merge across values files, so a shared teams
# file can be combined with per-environment overrides. Setting a team to null
# in an environment file removes it there.
# orders:
#   description: Team Orders
#   adGroups: ["AD-Kafka-Orders"]
#   owns:
#     topics: ["orders.*"]
#     consumerGroups: ["orders.*"]
#     transactionalIds: []
#   grants:
#     - role: topic-reader
#       topics: ["reference.*"]
teams: {}

# -- People with full rights on the cluster. Empty adGroups disables it.
clusterAdmins:
  adGroups: []

# -- ADFS identity provider. The chart owns the provider and ALL its mappers
# (managed "full"), so existing mappers must be listed under extraMappers.
identityProvider:
  enabled: true
  alias: adfs
  # -- oidc or saml. ADFS is federated as OIDC in our realm.
  providerId: oidc
  displayName: ADFS
  # -- OIDC claim (or SAML attribute name) that carries the AD group names.
  groupsAttribute: groups
  # -- SAML only: use the attribute's friendly name instead of its name.
  groupsAttributeFriendlyName: ""
  # -- Keycloak user attribute the AD groups are imported into.
  userAttribute: groups
  syncMode: FORCE
  # -- Raw provider config (authorizationUrl, tokenUrl, clientId, ...).
  # Secrets go in as $(env:NAME) and are substituted at import time.
  config: {}
  # -- Additional mappers rendered as-is, e.g. the existing email, firstName,
  # lastName and username template mappers. identityProviderAlias is filled in.
  extraMappers: []

# -- The Kafka broker client that Strimzi's KeycloakAuthorizer uses.
kafka:
  clientId: kafka
  # -- Optional Strimzi cluster name. When set, resources are named
  # "kafka-cluster:<name>,Topic:<pattern>" so several clusters can share a realm.
  clusterName: ""
  # -- Environment variable (in the Job) holding the client secret.
  secretEnv: KAFKA_CLIENT_SECRET
  # -- Authorization scopes, as expected by Strimzi's KeycloakAuthorizer.
  scopes: [Create, Read, Write, Delete, Alter, Describe, ClusterAction, DescribeConfigs, AlterConfigs, IdempotentWrite]
  decisionStrategy: AFFIRMATIVE

# -- Reusable role profiles: Kafka scopes per resource type.
# Keys: topic, group, transactionalId, cluster.
roles:
  topic-owner:
    topic: [Describe, DescribeConfigs, Read, Write, Create, Delete, Alter, AlterConfigs]
    group: [Describe, Read, Delete]
    transactionalId: [Describe, Write]
  topic-reader:
    topic: [Describe, DescribeConfigs, Read]
    group: [Describe, Read]

# -- What "owning" a topic means in this environment. Set topic-reader in
# production, where only mTLS services write.
ownership:
  role: topic-owner

# -- Simple OIDC clients for GUIs (Kafka UI, Schema Registry, ...). They get the
# kafka-groups client scope so the user's groups end up in the token.
# - name: kafka-ui
#   redirectUris: ["https://kafka-ui.apps.example.com/*"]
#   secretEnv: KAFKA_UI_CLIENT_SECRET   # omit for a public client
#   serviceAccount: false
#   attributes: {}                       # raw client attributes
#   extra: {}                            # raw client config merged last
clients: []

# -- Defaults applied to every simple client.
clientDefaults:
  # -- Default client scopes; kafka-groups is always appended. Drop basic/acr on Keycloak < 25.
  scopes: [profile, email, roles, web-origins, basic, acr]

# -- The groups claim added by the kafka-groups client scope.
groupsClaim:
  name: groups
  # -- false gives "orders", true gives "/kafka/orders".
  fullPath: false
  # -- Also expose the raw AD group names (identityProvider.userAttribute) as a claim.
  includeAdAttribute: false
  adAttributeClaim: ad-groups

# -- Clients owned by someone else (the admin client from the Keycloak team).
# Rendered as bare stubs so import.managed.client=full leaves them untouched.
externalClients: []

# -- Raw realm representation merged last (mergeOverwrite: lists replace).
extraRealm: {}

image:
  repository: docker.io/adorsys/keycloak-config-cli
  # -- Format <cli-version>-<keycloak-version>. Pin to the RHBK version in use.
  tag: 6.5.1-26
  pullPolicy: IfNotPresent
imagePullSecrets: []

job:
  # -- Run as an ArgoCD PostSync hook. false gives a checksum-named Job instead.
  argocdHook: true
  hookDeletePolicy: BeforeHookCreation
  backoffLimit: 1
  activeDeadlineSeconds: 600
  # -- Only used when argocdHook is false.
  ttlSecondsAfterFinished: 86400
  # -- Secrets whose keys become environment variables, for $(env:...) substitution.
  envFrom: []
  # -- Extra environment variables for keycloak-config-cli.
  env: []
  # -- keycloak-config-cli import.managed.<entity> modes, rendered as
  # IMPORT_MANAGED_<ENTITY> with dashes removed (Spring relaxed binding).
  # Everything else defaults to "full". client-scope is no-delete because the
  # chart owns a single scope and must not remove Keycloak's optional built-ins.
  importManaged:
    client-scope: no-delete
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
